<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StarSharing · 分享你的收藏</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- ===== 导航栏 ===== -->
    <header class="navbar" id="navbar">
        <div class="navbar-brand" id="brandLink" style="cursor:pointer;">
            <span class="logo-icon">⭐</span>
            <span>StarSharing</span>
        </div>
        <div class="navbar-actions" id="navActions">
            <!-- 由 JS 动态渲染 -->
        </div>
    </header>

    <!-- ===== 主内容容器 ===== -->
    <main class="main" id="mainContent">

        <!-- 主页：网站列表 -->
        <div id="homeView">
            <div class="page-header">
                <div>
                    <h1>⭐ 发现好网站</h1>
                    <p>大家收藏的宝藏网站，一起分享探索</p>
                </div>
                <span class="stats" id="statsCount">共 0 个网站</span>
            </div>
            <div id="websiteGrid">
                <div class="loading">
                    <div class="spinner"></div>
                    <span>加载中...</span>
                </div>
            </div>
        </div>

        <!-- 个人空间视图（默认隐藏） -->
        <div id="profileView" style="display:none; height:100%;">
            <div class="profile-layout">
                <!-- 左侧菜单 -->
                <aside class="profile-sidebar">
                    <ul class="profile-menu">
                        <li class="profile-menu-item active" data-tab="info">👤 个人资料</li>
                        <!-- 未来可扩展更多板块 -->
                    </ul>
                </aside>
                <!-- 右侧内容 -->
                <section class="profile-content">
                    <!-- 个人资料板块 -->
                    <div class="profile-tab-panel active" id="tab-info">
                        <h2>个人资料</h2>
                        <div class="profile-header">
                            <!-- 头像区域（含悬停遮罩） -->
                            <div class="profile-avatar-wrapper" id="avatarWrapper">
                                <img id="profileAvatar" src="" alt="头像" class="profile-avatar-img" />
                                <div class="avatar-overlay" id="avatarOverlay">
                                    <span>修改</span>
                                </div>
                            </div>
                            <!-- 右侧信息 -->
                            <div class="profile-info">
                                <div class="profile-name-row">
                                    <span id="profileUsernameDisplay">未设置</span>
                                    <button class="btn btn-outline btn-sm" id="editUsernameBtn">编辑</button>
                                </div>
                                <div id="usernameEditArea" style="display:none; margin-top:4px;">
                                    <input type="text" id="usernameInput" placeholder="新用户名" class="profile-input" />
                                    <div style="margin-top:4px; display:flex; gap:6px;">
                                        <button class="btn btn-primary btn-sm" id="saveUsernameBtn">保存</button>
                                        <button class="btn btn-outline btn-sm" id="cancelUsernameBtn">取消</button>
                                    </div>
                                    <div id="usernameLimitInfo" class="profile-limit-info"></div>
                                </div>
                                <div class="profile-email">
                                    <span id="profileEmailDisplay"></span>
                                </div>
                                <div class="profile-limit-info" id="avatarLimitInfo"></div>
                            </div>
                        </div>
                        <!-- 隐藏的文件输入（供头像遮罩点击触发） -->
                        <input type="file" id="avatarFileInput" accept="image/*" style="display:none;" />
                    </div>
                </section>
            </div>
        </div>
    </main>
    <!-- ===== 头像裁剪模态框 ===== -->
    <div class="modal-overlay" id="cropModal">
        <div class="modal crop-modal">
            <button class="modal-close" id="cropModalClose">✕</button>
            <h2>调整头像</h2>
            <p class="subtitle">拖动或缩放图片，圆形区域将作为最终头像</p>
            <div class="crop-container">
                <div class="crop-viewport">
                    <canvas id="cropCanvas"></canvas>
                    <div class="crop-mask">
                        <div class="crop-circle"></div>
                    </div>
                </div>
                <div class="crop-controls">
                    <button class="btn btn-outline btn-sm" id="zoomInBtn">➕</button>
                    <button class="btn btn-outline btn-sm" id="zoomOutBtn">➖</button>
                    <button class="btn btn-outline btn-sm" id="resetCropBtn">重置</button>
                </div>
            </div>
            <div class="form-actions" style="margin-top:16px;">
                <button class="btn btn-outline" id="cropCancelBtn">取消</button>
                <button class="btn btn-primary" id="cropConfirmBtn">确认裁剪</button>
            </div>
        </div>
    </div>
    <!-- ===== 浮动添加按钮 ===== -->
    <button class="fab hidden" id="fabAdd" title="添加网站">＋</button>

    <!-- ===== 模态框：认证 ===== -->
    <div class="modal-overlay" id="authModal">
        <div class="modal">
            <button class="modal-close" id="authModalClose">✕</button>
            <h2 id="authModalTitle">欢迎回来</h2>
            <p class="subtitle" id="authModalSub">登录你的账号，继续分享收藏</p>
            <div class="tabs" id="authTabs">
                <button class="active" data-tab="login">登录</button>
                <button data-tab="register">注册</button>
            </div>
            <div class="tab-content active" id="tabLogin">
                <form id="loginForm" autocomplete="off">
                    <div class="form-group">
                        <label>邮箱</label>
                        <input type="email" id="loginEmail" placeholder="your@email.com" required />
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" id="loginPassword" placeholder="至少 6 位" required minlength="6" />
                    </div>
                    <div class="form-error" id="loginError"></div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">登录</button>
                    </div>
                </form>
            </div>
            <div class="tab-content" id="tabRegister">
                <form id="registerForm" autocomplete="off">
                    <div class="form-group">
                        <label>昵称</label>
                        <input type="text" id="registerUsername" placeholder="例如: 小明" required />
                    </div>
                    <div class="form-group">
                        <label>邮箱</label>
                        <input type="email" id="registerEmail" placeholder="your@email.com" required />
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" id="registerPassword" placeholder="至少 6 位" required minlength="6" />
                    </div>
                    <div class="form-error" id="registerError"></div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">注册</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- ===== 模态框：添加网站 ===== -->
    <div class="modal-overlay" id="addModal">
        <div class="modal">
            <button class="modal-close" id="addModalClose">✕</button>
            <h2>✨ 添加收藏</h2>
            <p class="subtitle">分享你发现的好网站，让更多人看到</p>
            <form id="addForm">
                <div class="form-group">
                    <label>网站标题 <span class="required">*</span></label>
                    <input type="text" id="addTitle" placeholder="例如: 阮一峰的网络日志" required />
                </div>
                <div class="form-group">
                    <label>网址 <span class="required">*</span></label>
                    <input type="url" id="addUrl" placeholder="https://example.com" required />
                    <div class="hint">请输入完整的网址，包含 https://</div>
                </div>
                <div class="form-group">
                    <label>描述</label>
                    <textarea id="addDesc" placeholder="简单介绍一下这个网站…" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>分类</label>
                    <input type="text" id="addCategory" placeholder="例如: 技术、设计、工具、阅读" />
                </div>
                <div class="form-error" id="addError"></div>
                <div class="form-actions">
                    <button type="button" class="btn btn-outline" id="addModalCancel">取消</button>
                    <button type="submit" class="btn btn-primary">添加分享</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ===== Toast 容器 ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="script.js"></script>
</body>
</html>
